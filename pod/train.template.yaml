# LTX-2.5 LoRA training settings that produced the clone this kit is based on (2,000 steps, rank 32).
# scripts/2_prepare_dataset.py fills in the {{...}} parts and writes my-clone/dataset/train.yaml. You should not need to edit this.
model:
  model_path: /root/models25/diffusion_models/ltx-2.5-22b-dev-transformer-bf16.safetensors
  text_encoder_path: /root/models25/text_encoders/gemma4-12b-with-proj-ltx-2.5-bf16.safetensors
  video_vae_path: /root/models25/vae/ltx-2.5-video-vae-bf16.safetensors
  audio_vae_path: /root/models25/vae/ltx-2.5-audio-vae-bf16.safetensors
  training_mode: lora
  load_checkpoint: null
lora:
  rank: 32
  alpha: 32
  dropout: 0.0
  target_modules: ["to_k", "to_q", "to_v", "to_out.0"]
training_strategy:
  name: flexible
  video:
    is_generated: true
    latents_dir: latents
    conditions:
      - type: first_frame
        probability: 0.5
  audio:
    is_generated: true
    latents_dir: audio_latents
optimization:
  learning_rate: 1e-4
  steps: 2000
  batch_size: 1
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  optimizer_type: adamw
  scheduler_type: linear
  scheduler_params: {}
  enable_gradient_checkpointing: true
acceleration:
  mixed_precision_mode: bf16
  quantization: null
  load_text_encoder_in_8bit: false
  offload_optimizer_during_validation: false
data:
  preprocessed_data_root: /root/dataset/.precomputed
  num_dataloader_workers: 2
validation:
  samples:
    - prompt: >-
        {{TRIGGER}}, In a static medium shot framed from the waist up, {{PERSON}} wearing {{WARDROBE}}
        stands against {{BACKDROP}} and speaks directly to the camera in a calm, conversational tone,
        saying, "Hi, this is a test of my video clone. If you can hear me clearly, the training is working."
        There is no background music.
      conditions:
        - type: first_frame
          image_or_video: /root/dataset/val_first_frame.png
  negative_prompt: >-
    blurry, out of focus, distorted face, deformed facial features, extra limbs, disfigured hands, flickering,
    mismatched lip sync, silent or muted audio, distorted voice, robotic voice, echo, off-sync audio,
    incorrect dialogue, added dialogue, cartoonish rendering, 3D CGI look, waxy skin, plastic skin
  video_dims: [544, 960, 121]
  frame_rate: 30.0
  seed: 42
  inference_steps: 30
  interval: 250
  video_cfg_scale: 3.0
  audio_cfg_scale: 7.0
  video_stg_scale: 1.0
  audio_stg_scale: 1.0
  stg_blocks: [28]
  guidance_rescale: 0.7
  video_modality_guidance_scale: 3.0
  audio_modality_guidance_scale: 3.0
  generate_audio: true
  skip_initial_validation: false
checkpoints:
  interval: 250
  keep_last_n: -1
  precision: bfloat16
flow_matching:
  timestep_sampling_mode: shifted_logit_normal
  timestep_sampling_params: {}
hub:
  push_to_hub: false
  hub_model_id: null
wandb:
  enabled: false
  project: ltx-2-trainer
  entity: null
  tags: [lora]
